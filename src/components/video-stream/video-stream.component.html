<main class="videostream">
    <div class="videostream__container">
        <div class="videostream__container__stream">
            <span class="videostream__container__stream__title">Video stream</span>
            <video
                #video
                class="videostream__container__stream__video"
                autoplay
                playsinline
                controls
                width="720"
                height="480"
                (error)="onVideoError()"></video>
            @if (streamError()) {
                <p class="videostream__container__stream__error">
                    {{ backendStatus.isOffline() ? offlineMessage : 'The stream is unavailable. The camera may still be starting up.' }}
                </p>
                <button class="button" (click)="cameraOn()">Retry</button>
            }
            <button class="button" [disabled]="(cameraTurnedOn() && !streamError()) || backendStatus.isOffline()" (click)="cameraOn()">
                Camera ON
            </button>
        </div>
        <div>
            <div class="videostream__container__light">
                <div class="videostream__container__light__icon">
                    <fa-icon [icon]="faLightbulb" size="xl" />
                </div>
                <slider (valueChange)="setBrightness($event)"></slider>
            </div>
            <div class="videostream__container__steering">
                <longpress-button (press)="move('UP_LEFT')">
                    <fa-icon [icon]="faAngleUp" rotate="-45deg" size="3x" />
                </longpress-button>
                <longpress-button (press)="move('UP')">
                    <fa-icon [icon]="faAngleUp" size="3x" />
                </longpress-button>
                <longpress-button (press)="move('UP_RIGHT')">
                    <fa-icon [icon]="faAngleUp" rotate="45deg" size="3x" />
                </longpress-button>
                <longpress-button (press)="move('LEFT')">
                    <fa-icon [icon]="faAngleUp" rotate="-90deg" size="3x" />
                </longpress-button>
                <button class="button" (click)="move('CENTER')">
                    <fa-icon [icon]="faArrowsToCircle" size="2x" />
                </button>
                <longpress-button (press)="move('RIGHT')">
                    <fa-icon [icon]="faAngleUp" rotate="90deg" size="3x" />
                </longpress-button>
                <longpress-button (press)="move('DOWN_LEFT')">
                    <fa-icon [icon]="faAngleUp" rotate="225deg" size="3x" />
                </longpress-button>
                <longpress-button (press)="move('DOWN')">
                    <fa-icon [icon]="faAngleUp" rotate="180deg" size="3x" />
                </longpress-button>
                <longpress-button (press)="move('DOWN_RIGHT')">
                    <fa-icon [icon]="faAngleUp" rotate="135deg" size="3x" />
                </longpress-button>
            </div>
        </div>
    </div>
</main>
