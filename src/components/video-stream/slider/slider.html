<div class="slider">
    <label class="slider__label" [for]="id">{{ label }}</label>
    <input class="slider__input" [id]="id" type="range" min="0" max="255" step="1" [value]="value" [disabled]="disabled" (input)="onInput($event)" />
    <output class="slider__value" [for]="id">{{ percent }}%</output>
</div>
