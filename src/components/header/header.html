<header class="header">
    <a class="header__brand" routerLink="/">
        <span class="header__brand__name">The Raspberry SPY</span>
        <span class="header__brand__author">by Filip Wiśniewski</span>
    </a>
    <nav class="header__tabs" aria-label="Main">
        <a routerLink="/app/video" routerLinkActive="header__tabs__tab--active" ariaCurrentWhenActive="page">Live stream</a>
        <a routerLink="/app/alarm" routerLinkActive="header__tabs__tab--active" ariaCurrentWhenActive="page">Alarm</a>
        <a routerLink="/app/stats" routerLinkActive="header__tabs__tab--active" ariaCurrentWhenActive="page">Stats</a>
        <a routerLink="/">Portfolio</a>
    </nav>
    <div class="header__actions">
        <theme-toggle />
        <button class="button button--ghost button--small" type="button" aria-label="Sign out" (click)="logout()">
            <fa-icon [icon]="faArrowRightFromBracket" />
            <span class="header__signout">Sign out</span>
        </button>
    </div>
</header>
