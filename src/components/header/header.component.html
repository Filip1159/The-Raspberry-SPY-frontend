<header class="header">
    <div class="header__banner">
        <a routerLink="/"><img class="header__banner__img" src="raspberry-pi.svg" alt="Back to the portfolio" /></a>
        <h1 class="header__banner__name">Raspberry UI</h1>
    </div>
    <nav class="header__tabs">
        <a routerLink="/app/video" class="header__tabs__tab">Live stream</a>
        <a routerLink="/app/alarm" class="header__tabs__tab">Alarm</a>
        <a routerLink="/" class="header__tabs__tab">Portfolio</a>
    </nav>
    <div class="header__icons">
        @if (auth.isLoggedIn()) {
            <stats></stats>
            <div class="header__logout" (click)="logout()">
                <fa-icon [icon]="faArrowRightFromBracket" size="3x" color="white" />
            </div>
        }
    </div>
</header>
