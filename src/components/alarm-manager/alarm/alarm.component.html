<article class="alarm" [class.alarm--off]="!form.value.enabled" [attr.aria-label]="'Alarm on ' + day">
    <div class="alarm__top">
        <h2 class="alarm__day">{{ day }}</h2>
        <label class="switch">
            <input
                class="switch__input"
                type="checkbox"
                role="switch"
                [checked]="form.value.enabled"
                [attr.aria-label]="'Alarm on ' + day + ' enabled'"
                (change)="toggleEnabled()" />
            <span class="switch__track" aria-hidden="true"></span>
            <span class="switch__text">{{ form.value.enabled ? 'On' : 'Off' }}</span>
        </label>
    </div>

    <div class="alarm__row">
        <label class="alarm__label" [for]="'time-' + day">Time</label>
        <input class="field__input alarm__time" [id]="'time-' + day" type="time" required [value]="time" (change)="setTime($event)" />
    </div>

    <div class="alarm__row">
        <label class="alarm__label" [for]="'melody-' + day">Melody</label>
        <select class="field__input alarm__melody" [id]="'melody-' + day" (change)="setMelody($event)">
            @for (m of melodies; track m) {
                <option [value]="m" [selected]="m === form.value.melody">{{ m }}</option>
            }
        </select>
        <button
            class="button button--secondary alarm__play"
            type="button"
            [attr.aria-label]="'Play the melody ' + form.value.melody + ' on the Raspberry'"
            [disabled]="backendStatus.isOffline()"
            (click)="play()">
            <fa-icon [icon]="faPlay" />
        </button>
    </div>
</article>
