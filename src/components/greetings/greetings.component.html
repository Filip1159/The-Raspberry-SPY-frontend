<form class="greetings" [formGroup]="form" (ngSubmit)="send()">
    <label class="greetings__title" for="greeting-text">Send me a greeting!</label>
    <textarea
        id="greeting-text"
        class="field__input greetings__textarea"
        rows="3"
        placeholder="Let me know what you think. Or maybe who you are..."
        [attr.maxlength]="maxLength"
        [formControl]="form.controls.text"></textarea>
    <div class="greetings__footer">
        <span class="greetings__counter" [class.greetings__counter--limit]="text().length >= maxLength"> {{ text().length }}/{{ maxLength }} </span>
        <button class="button" type="submit" [disabled]="text().trim() === '' || text().length > maxLength || sending() || backendStatus.isOffline()">
            {{ sending() ? 'Sending...' : 'Send' }}
            <fa-icon [icon]="faPaperPlane" size="sm" />
        </button>
    </div>
    @if (backendStatus.isOffline()) {
        <p class="notice" role="status">{{ offlineMessage }}</p>
    }
</form>
