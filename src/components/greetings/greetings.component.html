<div class="greetings" [formGroup]="form">
    <div class="greetings__form">
        <h4 class="greetings__form__header">Send me a greeting!</h4>
        <textarea
            placeholder="Let me know what you think. Or maybe who you are..."
            class="greetings__form__textarea"
            [formControl]="form.controls.text"></textarea>
        @if (backendStatus.isOffline()) {
            <p class="greetings__form__offline">{{ offlineMessage }}</p>
        }
    </div>
    <button class="button greetings__button" [disabled]="form.controls.text.value.trim() === '' || backendStatus.isOffline()" (click)="send()">
        Send
        <fa-icon class="greetings__sendIcon" [icon]="faPaperPlane" size="sm" />
    </button>
</div>
